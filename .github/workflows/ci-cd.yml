name: Backend CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [development, staging, production]
  workflow_dispatch:

permissions:
  contents: read

# Every commit gets CI; only the deploy job serializes the shared destination.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.3'
  SEMGREP_VERSION: '1.185.0'
  DEPENDENCY_CHECK_VERSION: '13.0.0'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: github-unit-coverage
          path: |
            coverage/
            test-results.xml
          retention-days: 7

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep
        run: |
          python -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --no-cache-dir "semgrep==$SEMGREP_VERSION"
          mkdir -p reports/sast
      - name: Scan source and block findings
        run: |
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan \
            --config p/javascript --config p/nodejs \
            --error --strict --metrics=off --disable-version-check \
            --sarif-output reports/sast/semgrep.sarif \
            --json-output reports/sast/semgrep.json src
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: github-sast-reports
          path: reports/sast/
          retention-days: 7

  dependencies:
    name: OWASP Dependency-Check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies for OWASP analysis
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require independent NVD secret
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo '::error::Configure the GitHub NVD_API_KEY secret before running Dependency-Check.'
            exit 1
          fi
      - name: Install verified Dependency-Check
        run: |
          mkdir -p reports/dependency-check "$RUNNER_TEMP/dependency-check-data"
          curl --fail --location --retry 3 \
            "https://github.com/dependency-check/DependencyCheck/releases/download/v$DEPENDENCY_CHECK_VERSION/dependency-check-$DEPENDENCY_CHECK_VERSION-release.zip" \
            --output "$RUNNER_TEMP/dependency-check.zip"
          echo "44d920d1ec03e948df862a253f0912782a31b9beee8a7c8895b9cb95760176ed  $RUNNER_TEMP/dependency-check.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/dependency-check.zip" -d "$RUNNER_TEMP/owasp"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: dependency-check-${{ runner.os }}-${{ env.DEPENDENCY_CHECK_VERSION }}-
      - name: Scan all dependencies (CVSS >= 7 blocks)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python3 scripts/dependency-check.py \
            "$RUNNER_TEMP/owasp/dependency-check/bin/dependency-check.sh" \
            "$RUNNER_TEMP/dependency-check-data"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: github-dependency-check-reports
          path: reports/dependency-check/
          retention-days: 7

  secrets:
    name: Gitleaks secret detection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        run: |
          mkdir -p reports/secrets "$RUNNER_TEMP/gitleaks"
          curl --fail --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan fetched history with redaction
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="--all" \
            --redact=100 --no-banner --report-format sarif \
            --report-path reports/secrets/gitleaks.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: github-secret-reports
          path: reports/secrets/
          retention-days: 7

  package:
    name: Package runtime artifact
    needs: [tests, sast, dependencies, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Build deployment ZIP
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/package-deployment.py --output dist/backend.zip --commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-backend
          path: dist/backend.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy verified demonstration artifact
    needs: [tests, sast, dependencies, secrets, package]
    if: >-
      success() && github.event_name == 'push' &&
      github.ref == 'refs/heads/production' && vars.ENABLE_GITHUB_DEPLOYMENT == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: adopet-github-demo
    concurrency:
      group: deploy-adopet-github-demo
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_ENABLED: ${{ vars.ENABLE_GITHUB_DEPLOYMENT }}
      DEPLOY_APP_NAME: ${{ vars.AZURE_APP_NAME }}
      DEPLOY_HEALTH_URL: ${{ vars.AZURE_HEALTH_URL }}
      SOURCE_BRANCH: ${{ github.ref }}
      SOURCE_COMMIT: ${{ github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      CI_EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-backend
          path: dist
      - name: Verify configuration and current branch commit
        run: node scripts/assert-deployment.js github
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      - uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ env.DEPLOY_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: dist/backend.zip
      - name: Verify process liveness and deployed commit
        run: node scripts/check-health.js
        env:
          DEPLOY_HEALTH_CHECK: liveness
