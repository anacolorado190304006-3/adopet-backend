name: Promote AdoPet Backend

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:

  promote-staging:
    name: Promote to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Promote development → staging
        run: |
          git fetch origin
          git checkout staging
          git merge origin/development --ff-only
          git push origin staging

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Build
        run: npm run build

  promote-production:
    name: Promote to Production
    needs: promote-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Promote staging → production
        run: |
          git fetch origin
          git checkout production
          git merge origin/staging --ff-only
          git push origin production
